name: RPGWorldGenerator
version: 1.0.0
main: com.rpgworldgen.RPGWorldGeneratorPlugin
api-version: '1.20'
author: RPGWorldGenerator Team
description: Procedural RPG adventure world generator for Spigot/Paper.
website: https://github.com/example/rpgworldgenerator
softdepend: [Multiverse-Core, WorldEdit, WorldGuard, Vault, Citizens, PlaceholderAPI, dynmap, BlueMap]
commands:
  rpgworld:
    description: Manage RPG world generation.
    usage: /rpgworld <help|create|preview|generate|pause|resume|cancel|status|regions|locate|regenerate|link|reload|info> [...]
    permission: rpgworld.admin
    permission-message: You do not have permission to use this command.
permissions:
  rpgworld.admin:
    description: Full access to all RPGWorldGenerator commands.
    default: op
    children:
      rpgworld.create: true
      rpgworld.generate: true
      rpgworld.preview: true
      rpgworld.regenerate: true
      rpgworld.reload: true
      rpgworld.info: true
  rpgworld.create:
    description: Create new RPG worlds.
    default: op
  rpgworld.generate:
    description: Start, pause, resume, or cancel generation.
    default: op
  rpgworld.preview:
    description: Preview a world generation plan.
    default: op
  rpgworld.regenerate:
    description: Regenerate a region (requires confirmation).
    default: op
  rpgworld.reload:
    description: Reload plugin configuration.
    default: op
  rpgworld.info:
    description: View world info and status.
    default: true
